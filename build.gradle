plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def loadBuildVersion() {
    def propsFile = file('build.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def v = props.getProperty('mod_version')
        if (v) return v.trim()
    }
    return project.findProperty('mod_version') ?: '1.0'
}

version = loadBuildVersion()
group = project.findProperty('mod_group_id') ?: 'com.neofast.tech_revised'
base.archivesName = project.findProperty('mod_id') ?: 'tech_revised'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
println("Building ${base.archivesName.get()}-${version}.jar")

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

sourceSets {
    main {
        java {
            exclude 'com/neofast/tech_revised/integration/jade/**'
            exclude 'com/neofast/tech_revised/integration/jei/**'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'tech_revised',
                'Specification-Vendor'    : 'NeofastFTL',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'NeofastFTL'
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.register('incrementVersion') {
    group = 'build'
    description = 'Increments mod_version in build.properties (and syncs gradle.properties)'

    doLast {
        def propsFile = file('build.properties')
        if (!propsFile.exists()) {
            propsFile.text = "# Build properties for Technology Revised\nmod_version=1.0\n"
        }

        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def current = (props.getProperty('mod_version') ?: '1.0').trim()

        def parts = current.split(/[^0-9]+/).findAll { it }.collect { it as int }
        while (parts.size() < 2) parts << 0

        def part = (project.findProperty('part') ?: 'minor').toString().toLowerCase()
        switch (part) {
            case 'major':
                parts[0]++
                for (int i = 1; i < parts.size(); i++) parts[i] = 0
                break
            case 'patch':
                if (parts.size() < 3) parts << 0
                parts[2]++
                break
            case 'minor':
            default:
                parts[1]++
                for (int i = 2; i < parts.size(); i++) parts[i] = 0
                break
        }

        def newVersion = parts.join('.')
        props.setProperty('mod_version', newVersion)

        propsFile.text = """# Build properties for Technology Revised
# Edit mod_version (or run ./gradlew incrementVersion) when you add new features.
# The built jar will be named: tech_revised-<mod_version>.jar

mod_version=${newVersion}
""".stripIndent()

        def gp = file('gradle.properties')
        if (gp.exists()) {
            def text = gp.getText('UTF-8')
            if (text.contains('mod_version=')) {
                gp.text = text.replaceAll(/(?m)^mod_version=.*/, "mod_version=${newVersion}")
            }
        }

        println "Version incremented: ${current} -> ${newVersion}"
        println "Next jar will be: ${base.archivesName.get()}-${newVersion}.jar"
        println "Run ./gradlew build to produce the new jar."
    }
}
