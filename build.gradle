buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://maven.minecraftforge.net' }
        maven {
            url "https://cursemaven.com"
        }

    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// Load version from build.properties (preferred) or fall back to gradle.properties mod_version
def loadBuildVersion() {
    def propsFile = file('build.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def v = props.getProperty('mod_version')
        if (v) return v.trim()
    }
    return project.findProperty('mod_version') ?: '1.0'
}

version = loadBuildVersion()
group = project.findProperty('mod_group_id') ?: 'com.neofast.tech_revised'
archivesBaseName = project.findProperty('mod_id') ?: 'tech_revised'

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
println("Building ${archivesBaseName}-${version}.jar")
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // snapshot   YYYYMMDD   Snapshot are built nightly.
    // stable     #          Stables are built at the discretion of the MCP team.
    // official   MCVersion  Official field/method names from Mojang mapping files
    //
    // You must be aware of the Mojang license when using the 'official' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'official', version: '1.20.1'

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg') // Currently, this location cannot be changed from the default.

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', 'tech_revised'

            mods {
                tech_revised {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', 'tech_revised'

            mods {
                tech_revised {
                    source sourceSets.main
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', 'tech_revised'

            mods {
                tech_revised {
                    source sourceSets.main
                }
            }
        }

    }
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use. If this is any group other than 'net.minecraft', it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency, and its patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation fg.deobf("curse.maven:pipez-443900:6945379")
    implementation fg.deobf("curse.maven:jei-238222:7391695")
    implementation fg.deobf("curse.maven:mekanism-268560:6552911")
    implementation fg.deobf("curse.maven:ctm-267602:5983309")
    // Examples using mod jars from ./libs
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "tech_revised",
                "Specification-Vendor"    : "NeofastFTL",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "NeofastFTL",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
// publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// ---------------------------------------------------------------------------
// Version increment helper
// Run:  ./gradlew incrementVersion          -> bumps 1.5 -> 1.6
//        ./gradlew incrementVersion -Ppart=major  -> 1.5 -> 2.0
//        ./gradlew incrementVersion -Ppart=minor  -> 1.5 -> 1.6 (default)
//        ./gradlew incrementVersion -Ppart=patch  -> 1.5.0 -> 1.5.1
// Then rebuild:  ./gradlew build
// ---------------------------------------------------------------------------
tasks.register('incrementVersion') {
    group = 'build'
    description = 'Increments mod_version in build.properties (and syncs gradle.properties)'

    doLast {
        def propsFile = file('build.properties')
        if (!propsFile.exists()) {
            propsFile.text = "# Build properties for Technology Revised\nmod_version=1.0\n"
        }

        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def current = (props.getProperty('mod_version') ?: '1.0').trim()

        def parts = current.tokenizeAll(/[^0-9]+/, ' ').trim().split(/\s+/).findAll { it }.collect { it as int }
        while (parts.size() < 2) parts << 0   // at least major.minor

        def part = (project.findProperty('part') ?: 'minor').toString().toLowerCase()
        switch (part) {
            case 'major':
                parts[0]++
                for (int i = 1; i < parts.size(); i++) parts[i] = 0
                break
            case 'patch':
                if (parts.size() < 3) parts << 0
                parts[2]++
                break
            case 'minor':
            default:
                parts[1]++
                for (int i = 2; i < parts.size(); i++) parts[i] = 0
                break
        }

        def newVersion = parts.join('.')
        props.setProperty('mod_version', newVersion)

        // Write build.properties preserving a short header
        propsFile.text = """# Build properties for Technology Revised
# Edit mod_version (or run ./gradlew incrementVersion) when you add new features.
# The built jar will be named: tech_revised-<mod_version>.jar

mod_version=${newVersion}
""".stripIndent()

        // Keep gradle.properties in sync if it contains mod_version
        def gp = file('gradle.properties')
        if (gp.exists()) {
            def text = gp.getText('UTF-8')
            if (text.contains('mod_version=')) {
                gp.text = text.replaceAll(/(?m)^mod_version=.*/, "mod_version=${newVersion}")
            }
        }

        println "Version incremented: ${current} -> ${newVersion}"
        println "Next jar will be: ${archivesBaseName}-${newVersion}.jar"
        println "Run ./gradlew build to produce the new jar."
    }
}
